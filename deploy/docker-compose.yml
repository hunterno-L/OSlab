version: "3.8"

services:
  # Data is initialized only when mysql_data is empty. The loader script imports
  # the checked-in OSLab dump into MYSQL_DATABASE after MySQL creates it.
  mysql:
    image: mysql:8.0.36
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: oslab_db
      MYSQL_USER: "${MYSQL_APP_USERNAME:-oslab_app}"
      MYSQL_PASSWORD: "${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in deploy/.env}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in deploy/.env}"
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ../数据库文件/oslab_db.sql:/seed/oslab_db.sql:ro
      - ../数据库文件/oslab_upgrade_v3_learning.sql:/seed/oslab_upgrade_v3_learning.sql:ro
      - ../数据库文件/oslab_upgrade_v4_flow.sql:/seed/oslab_upgrade_v4_flow.sql:ro
      - ../数据库文件/oslab_upgrade_v5_teaching.sql:/seed/oslab_upgrade_v5_teaching.sql:ro
      - ../数据库文件/oslab_demo_seed_v3.sql:/seed/oslab_demo_seed_v3.sql:ro
      - ../数据库文件/oslab_seed_v4_content.sql:/seed/oslab_seed_v4_content.sql:ro
      - ./mysql-init/10-load-oslab-db.sh:/docker-entrypoint-initdb.d/10-load-oslab-db.sh:ro
    networks:
      - oslab-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=localhost --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7.2.5-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/.env}"
      TZ: Asia/Shanghai
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    networks:
      - oslab-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Runs once against the named data volume before Neo4j is allowed to start.
  # It deliberately refuses to load over an existing, unmarked database.
  neo4j-seed:
    image: neo4j:4.4.39-community
    restart: "no"
    # A new Docker named volume is root-owned. The seed script adjusts only
    # this volume, then executes neo4j-admin as the image's neo4j user (7474).
    user: "0:0"
    environment:
      NEO4J_SEED_ACCEPT_EXISTING_DATA: "${NEO4J_SEED_ACCEPT_EXISTING_DATA:-false}"
      TZ: Asia/Shanghai
    entrypoint: ["/bin/sh", "/seed/10-seed-graph.sh"]
    volumes:
      - neo4j_data:/data
      - ../数据库文件/graph.db.dump:/seed/graph.db.dump:ro
      - ./neo4j-init/10-seed-graph.sh:/seed/10-seed-graph.sh:ro
    networks:
      - oslab-network

  neo4j:
    image: neo4j:4.4.39-community
    restart: unless-stopped
    depends_on:
      neo4j-seed:
        condition: service_completed_successfully
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in deploy/.env}"
      NEO4J_dbms_memory_pagecache_size: 256M
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 512M
      TZ: Asia/Shanghai
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - oslab-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s

  # Spring Boot 2.7 uses the Elasticsearch 7.x client line. This service is
  # internal-only because the application needs it for post search/index sync.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.22
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      TZ: Asia/Shanghai
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - oslab-network
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s

  # The only component allowed to talk to Docker. It has no host port and
  # launches short-lived, network-disabled workers without socket mounts.
  sandbox:
    build:
      context: ../代码沙箱
      dockerfile: Dockerfile
    image: oslab-judge-sandbox:local
    restart: unless-stopped
    environment:
      SANDBOX_AUTH_SECRET: "${SANDBOX_AUTH_SECRET:?Set SANDBOX_AUTH_SECRET in deploy/.env}"
      SANDBOX_RUNNER_IMAGE: oslab-judge-sandbox:local
      SANDBOX_MAX_CONCURRENT: "2"
      TZ: Asia/Shanghai
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - sandbox-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  backend:
    build:
      context: ../后端代码/osLab-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8121
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/oslab_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai"
      SPRING_DATASOURCE_USERNAME: "${MYSQL_APP_USERNAME:-oslab_app}"
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in deploy/.env}"
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_DATABASE: 1
      SPRING_REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/.env}"
      SPRING_REDIS_TIMEOUT: 5s
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in deploy/.env}"
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      AI_ARK_API_KEY: "${AI_ARK_API_KEY:-}"
      AI_ARK_BASE_URL: "${AI_ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}"
      AI_ARK_MODEL: "${AI_ARK_MODEL:-deepseek-v3-250324}"
      CODESANDBOX_TYPE: remote
      CODESANDBOX_REMOTE_URL: http://sandbox:8090/executeCode
      CODESANDBOX_REMOTE_AUTH_SECRET: "${SANDBOX_AUTH_SECRET:?Set SANDBOX_AUTH_SECRET in deploy/.env}"
      CODESANDBOX_REMOTE_TIMEOUT_MS: "30000"
      KNIFE4J_ENABLE: "false"
      KNIFE4J_BASIC_ENABLE: "false"
    expose:
      - "8121"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8121/api/health/liveness > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - oslab-network
      - sandbox-network

  frontend:
    build:
      context: ../前端代码/osLab-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${OSLAB_HTTP_PORT:-80}:80"
    networks:
      - oslab-network

networks:
  oslab-network:
    driver: bridge
  sandbox-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  elasticsearch_data:
