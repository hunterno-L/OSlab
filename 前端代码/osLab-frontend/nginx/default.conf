server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # 文本资源开启 gzip：Vue / Arco / ECharts 产物未压缩体积大，
    # 压缩后传输量约下降 70%，首屏 JS/CSS 下载明显加快。
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # 带 content-hash 的构建产物文件名随内容变化，可安全长缓存一年。
    location ~ "^/(js|css|fonts)/[^/]+\.[0-9a-f]{8}\.(js|css|woff2?|ttf|eot)$" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # public/ 下的图片等静态资源不带 hash，使用较短缓存，避免发版后长期命中旧图。
    location ~* "\.(png|jpe?g|webp|avif|gif|svg|ico)$" {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # SPA 入口必须每次回源校验，保证发版后立即引用新的资源文件名。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # ^~ 阻止上面的图片/资源正则 location 抢先匹配 /api 下的静态后缀请求。
    location ^~ /api/ {
        proxy_pass http://backend:8121;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
