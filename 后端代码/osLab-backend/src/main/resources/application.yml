
# 公共配置文件
# @author <a href="https://github.com/liyupi">程序员鱼皮</a>
# @from <a href="https://yupi.icu">编程导航知识星球</a>
spring:
  application:
    name: springboot-init
  # Local launches use this base configuration. The container image supplies the prod profile.
  profiles:
    default: dev
  # 支持 swagger3
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # session 配置
  session:
    # todo 取消注释开启分布式 session（须先配置 Redis）
    store-type: redis
    # 30 天过期
    timeout: 2592000
  # 数据库配置
  # todo 需替换配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/oslab_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  # Redis 配置
  # todo 需替换配置，然后取消注释
  redis:
    database: ${SPRING_REDIS_DATABASE:1}
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    timeout: ${SPRING_REDIS_TIMEOUT:5s}
    password: ${SPRING_REDIS_PASSWORD:}
  # Elasticsearch 配置
  # todo 需替换配置，然后取消注释
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${SPRING_ELASTICSEARCH_USERNAME:}
    password: ${SPRING_ELASTICSEARCH_PASSWORD:}
  # 文件上传
  servlet:
    multipart:
      # 大小限制（任务附件单文件 10MB，预留 multipart 开销）
      max-file-size: 10MB
      max-request-size: 12MB
  neo4j:
    authentication:
      username: ${SPRING_NEO4J_AUTHENTICATION_USERNAME:neo4j}
      password: ${SPRING_NEO4J_AUTHENTICATION_PASSWORD:}
    uri: ${SPRING_NEO4J_URI:bolt://localhost:7687}
server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8121}
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 逐条 SQL 同步打 stdout 会显著拖慢图谱/工作台查询；需要排查时再临时打开。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
# 微信相关
wx:
  # 微信公众平台
  # todo 需替换配置
  mp:
    token: xxx
    aesKey: xxx
    appId: xxx
    secret: xxx
    config-storage:
      http-client-type: HttpClient
      key-prefix: wx
      redis:
        host: 127.0.0.1
        port: 6379
      type: Memory
  # 微信开放平台
  # todo 需替换配置
  open:
    appId: xxx
    appSecret: xxx
# 对象存储
# todo 需替换配置
cos:
  client:
    accessKey: ${COS_ACCESS_KEY:}
    secretKey: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-beijing}
    bucket: ${COS_BUCKET:}
# 教师学习任务私有附件（不放 public/static，容器部署需挂载持久卷）
oslab:
  tasks:
    storage-dir: ${OSLAB_TASK_STORAGE_DIR:./data/task-files}
    max-file-bytes: 10485760
    max-files-per-item: 5
# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.yupi.springbootinit.controller
# 代码沙箱配置
codesandbox:
  # A missing sandbox must fail a submission safely; it must never silently
  # mark arbitrary code as accepted through a demo implementation.
  type: ${CODESANDBOX_TYPE:remote}
  remote:
    url: ${CODESANDBOX_REMOTE_URL:}
    auth-secret: ${CODESANDBOX_REMOTE_AUTH_SECRET:}
    timeout-ms: ${CODESANDBOX_REMOTE_TIMEOUT_MS:30000}
# AI provider settings. Keep credentials out of source control. Set AI_ARK_API_KEY in the process environment.
ai:
  ark:
    api-key: ${AI_ARK_API_KEY:}
    base-url: ${AI_ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
    model: ${AI_ARK_MODEL:deepseek-v3-250324}
# Local development origins only. Production overrides this list from CORS_ALLOWED_ORIGINS.
cors:
  allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081
logging:
  level:
    # 全图快照会返回大量 Bolt 记录；逐条 DEBUG 会拖慢 /mastery/graph、/node、/path。
    org.neo4j: WARN
    org.springframework.data.neo4j: WARN
