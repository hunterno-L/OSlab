  <script>
    (() => {
      const root=document.getElementById('oslab-auth-flow');
      const canvas=root.querySelector('canvas');
      const context=canvas.getContext('2d');
      const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
      const account=root.querySelector('[name="userAccount"]');
      const password=root.querySelector('[name="userPassword"]');
      const confirm=root.querySelector('[name="checkPassword"]');
      const confirmRow=root.querySelector('.os-confirm-row');
      const submit=root.querySelector('.os-submit');
      const submitLabel=root.querySelector('[data-submit-label]');
      const error=root.querySelector('[data-error]');
      const motion=root.querySelector('[data-motion]');
      let mode='login',playing=!reduced.matches,focused=false,phase=.34,last=0,width=800,height=320;
      let pointerX=0,pointerY=0,currentX=0,currentY=0,visible=true,busy=false;
      function icons(){if(window.lucide)window.lucide.createIcons({attrs:{width:16,height:16}});}
      function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{mode,playing}}).catch(()=>{});}

      function setMode(next,persist=true){
        if(busy)return;
        mode=next==='register'?'register':'login';const isRegister=mode==='register';root.dataset.mode=mode;
        root.querySelectorAll('[data-mode-button]').forEach(tab=>tab.setAttribute('aria-selected',String(tab.dataset.modeButton===mode)));
        root.querySelector('#os-auth-panel').setAttribute('aria-labelledby',isRegister?'os-register-tab':'os-login-tab');
        root.querySelector('[data-auth-title]').textContent=isRegister?'创建你的学习账号':'继续你的学习';
        root.querySelector('[data-auth-subtitle]').textContent=isRegister?'从一个知识点开始，记录你的每次进步。':'登录 OSLab，接着探索你的知识路径。';
        submitLabel.textContent=isRegister?'创建账号':'登录';confirm.disabled=!isRegister;confirm.required=isRegister;confirmRow.inert=!isRegister;
        account.minLength=isRegister?4:1;password.minLength=isRegister?8:1;password.autocomplete=isRegister?'new-password':'current-password';
        password.value='';confirm.value='';error.textContent='';if(persist)save();
      }
      root.querySelectorAll('[data-mode-button]').forEach(tab=>tab.addEventListener('click',()=>setMode(tab.dataset.modeButton)));
      root.querySelector('[data-eye]').addEventListener('click',event=>{
        const show=password.type==='password';password.type=show?'text':'password';
        event.currentTarget.setAttribute('aria-label',show?'隐藏密码':'显示密码');event.currentTarget.dataset.tooltip=show?'隐藏密码':'显示密码';
        event.currentTarget.innerHTML='<i data-lucide="'+(show?'eye-off':'eye')+'" aria-hidden="true"></i>';icons();
      });
      root.querySelector('[data-enter]').addEventListener('click',()=>{account.focus();account.scrollIntoView({block:'center',behavior:reduced.matches?'instant':'smooth'});});
      root.querySelector('[data-about]').addEventListener('click',()=>root.querySelector('.os-capabilities').scrollIntoView({block:'nearest',behavior:reduced.matches?'instant':'smooth'}));
      motion.addEventListener('click',()=>{playing=!playing;motionState();save();if(!playing)draw();});
      root.querySelector('form').addEventListener('focusin',()=>{focused=true;});
      root.querySelector('form').addEventListener('focusout',()=>{focused=root.querySelector('form').contains(document.activeElement);});
      root.querySelector('form').addEventListener('submit',event=>{
        event.preventDefault();if(busy)return;error.textContent='';
        if(mode==='register'&&password.value!==confirm.value){error.textContent='两次输入的密码不一致';confirm.focus();return;}
        busy=true;submit.disabled=true;submitLabel.textContent=mode==='login'?'正在登录':'正在创建';
        root.dispatchEvent(new CustomEvent('oslab-auth-preview-submit',{detail:{mode}}));
        // This artifact demonstrates the busy state; account requests are wired in the Vue implementation.
        setTimeout(()=>{busy=false;submit.disabled=false;submitLabel.textContent=mode==='login'?'登录':'创建账号';},1100);
      });
      canvas.addEventListener('pointermove',event=>{if(event.pointerType==='touch'||reduced.matches)return;const box=canvas.getBoundingClientRect();pointerX=((event.clientX-box.left)/box.width-.5)*10;pointerY=((event.clientY-box.top)/box.height-.5)*6;});
      canvas.addEventListener('pointerleave',()=>{pointerX=0;pointerY=0;});
      function cubic(a,b,c,d,t){const m=1-t;return[m*m*m*a[0]+3*m*m*t*b[0]+3*m*t*t*c[0]+t*t*t*d[0],m*m*m*a[1]+3*m*m*t*b[1]+3*m*t*t*c[1]+t*t*t*d[1]];}
      function paths(offset=0){const anchors=[[-100,235],[74,195],[270,98],[485,196],[683,100],[788,234],[1010,257]],points=[];for(let i=0;i<anchors.length-1;i++){const a=[anchors[i][0],anchors[i][1]+offset],d=[anchors[i+1][0],anchors[i+1][1]+offset],wave=Math.sin(phase*Math.PI*2+i*.65)*1.5,b=[a[0]+(d[0]-a[0])*.4,a[1]],c=[d[0]-(d[0]-a[0])*.4,d[1]];a[1]+=wave;d[1]+=wave;for(let n=0;n<55;n++)points.push(cubic(a,b,c,d,n/54));}return points;}

        const scale=width/900;context.translate(currentX,Math.max(0,(height-310*scale)/2)+currentY);context.scale(scale,scale);
        for(let i=-12;i<=12;i++)stroke(paths(i*2.6),i%4===0?'#cbd2d8':'#e1e5e8',i%4===0?.9:.65);

        const labels=[[74,195,'虚拟内存'],[270,98,'页表'],[485,196,'缺页中断'],[683,100,'LRU']];

      }
      const resize=new ResizeObserver(()=>{const rect=canvas.getBoundingClientRect();width=rect.width;height=rect.height;const dpi=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(width*dpi);canvas.height=Math.round(height*dpi);draw();});resize.observe(canvas);
